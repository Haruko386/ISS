# Full ISS fine-tuning configuration based on Stable Diffusion 2 (768-v).
# This keeps the pixel-space auxiliary losses enabled, so training decodes the
# predicted clean latent through the VAE every step.
model:
  backend: stable-diffusion
  pretrained_model: /root/ApDepth/pretrained_checkpoint/stable-diffusion-2
  use_masks: true
  gradient_checkpointing: true
  enable_xformers: false
  channels_last: true

data:
  root: dataset/prepared/panoramas
  # The SD2 UNet is fully convolutional. This panorama-shaped resolution has
  # a similar pixel budget to its native 768x768 training resolution.
  image_height: 512
  image_width: 1024
  num_workers: 1

loss:
  diffusion: 1.0
  reconstruction: 0.05
  seam: 0.25
  gradient: 0.05
  preserve: 0.25

train:
  output_dir: outputs/sd2-pixel-loss
  batch_size: 1
  max_steps: 20000
  learning_rate: 0.00001
  weight_decay: 0.01
  # Full precision uses more memory, so keep the micro-batch at 1 and use
  # accumulation for a larger effective batch without lowering numerical precision.
  grad_accumulation: 8
  grad_clip: 1.0
  checkpoint_every: 1000
  # Validation runs diffusion sampling and can create a separate memory peak.
  # Run evaluation manually after checkpoints when training full resolution.
  validation_every: 0
  validation_batches: 2
  log_every: 10
  seed: 42
  device: cuda
  mixed_precision: "no"
  distributed: fsdp

diffusion:
  inference_steps: 30
  strength: 0.35
  # Stable Diffusion 2's 768-v checkpoint is trained with velocity prediction.
  # The beta schedule and training timestep count are loaded from the checkpoint.
  prediction_type: v_prediction
